<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { s: [[10,10],[7,5],[3,8],[0,0]] }; }
renderVals() {
  const base = [
    {name:'Court 1',stage:'Open SF · G3',a:'Varun / Neel',b:'Imran / Joseph'},
    {name:'Court 2',stage:'Mixed SF · G2',a:'Ishaan / Arav',b:'Asha / Lata'},
    {name:'Court 3',stage:'Pool A',a:'Kabir / Omar',b:'Dev / Yash'},
    {name:'Court 4',stage:'Women’s QF',a:'Fatima / Zara',b:'Gita / Rekha'}
  ];
  return { courts: base.map((c,i) => ({...c, sa:this.state.s[i][0], sb:this.state.s[i][1],
    tap: () => { const s = this.state.s.map(x => x.slice()); s[i][(s[i][0]+s[i][1]) % 2] += 1; this.setState({s}); }})) };
}
}
