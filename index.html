<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3EBDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120709" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_NAME%" />
    <link rel="icon" type="image/png" href="icons/%VITE_ICON%-192.png" />
    <link rel="apple-touch-icon" href="icons/%VITE_ICON%-apple-180.png" />
    <script id="pq-theme-init">(function(){var t='auto';try{var s=localStorage.getItem('pq-theme');if(s==='light'||s==='dark'||s==='auto')t=s;}catch(e){}var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.dataset.theme=t;r.style.colorScheme=d?'dark':'light';r.style.backgroundColor=d?'#120709':'#F3EBDD';document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=d?'#120709':'#F3EBDD';});})();</script>
    <title>%VITE_APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
